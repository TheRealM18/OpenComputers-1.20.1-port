plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

version = project.mod_version
group = project.mod_group
archivesBaseName = project.mod_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Print Java version for debugging
println('Java: ' + System.getProperty('java.version') + 
       ' JVM: ' + System.getProperty('java.vm.version') + 
       ' (' + System.getProperty('java.vendor') + ')')
println('Java home: ' + System.getProperty('java.home'))

repositories {
    mavenCentral()
    
    // Minecraft Forge Maven
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    
    // Parchment Mappings
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
    
    // OpenComputers Maven
    maven { 
        name = 'OpenComputers'
        url = 'https://maven.cil.li/'
    }
    
    // Other mod repositories
    maven { url = 'https://maven.tterrag.com' }  // For various mods
    maven { url = 'https://dvs1.progwml6.com/files/maven' }  // For JEI and similar
    maven { url = 'https://modmaven.dev' }  // For various mods
    maven { 
        name = 'TheIllusiveC4 Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    
    // Local libs directory for manual dependencies
    flatDir {
        dir 'libs'
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    
    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'opencomputers'
            
            mods {
                opencomputers {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'opencomputers'
            
            mods {
                opencomputers {
                    source sourceSets.main
                }
            }
        }
        
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'opencomputers', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            
            mods {
                opencomputers {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    
    // Minecraft Forge Maven
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    
    // Parchment Mappings
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    
    // OpenComputers Maven
    maven { 
        name = 'OpenComputers'
        url = 'https://maven.cil.li/'
    }
    
    // Local libs directory for manual dependencies
    flatDir {
        dir 'libs'
    }
    
    // Fallback repositories
    maven { url 'https://maven.tterrag.com/' }  // For various mods
    maven { url 'https://dvs1.progwml6.com/files/maven' }  // For JEI and similar
    maven { url 'https://modmaven.dev' }  // For various mods
    maven { 
        name = 'TheIllusiveC4 Maven'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    // Minecraft Forge
    minecraft 'net.minecraftforge:forge:1.20.1-47.1.0'
    
    // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    // OpenComputers core libraries from local libs
    implementation fg.deobf(files("libs/OpenComputers-MC1.20.1-1.9.1.0-api.jar"))
    
    // Core OpenComputers libraries (embedded)
    implementation fg.deobf(files(
        "libs/OC-LuaJ-20230703.1.jar",
        "libs/OC-JNLua-20230703.1.jar",
        "libs/OC-JNLua-Natives-20230703.1.jar"
    ))
    
    // Development-only dependencies
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.2.0.27") { transitive = false }
    
    // Example optional runtime dependencies (commented out by default)
    // runtimeOnly fg.deobf("mekanism:Mekanism:1.20.1-10.4.2.665")
    // runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-81")
    // runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:1.20.1-5.6.0.0")
    
    // Add any additional dependencies here
}

processResources {
    inputs.property 'version', project.version
    
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title": project.mod_id,
            "Specification-Vendor": "OpenComputers Team",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "OpenComputers Team",
            "MixinConfigs": "opencomputers.mixins.json",
            "FMLModType": "GAMELIBRARY"
        ])
    }
    
    // Include all dependencies in the JAR
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA',
                'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/maven/**',
                '**/module-info.class', 'META-INF/versions/**', 'META-INF/services/**'
    }
    
    // Ensure reproducible builds
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    
    // Ensure the JAR is built with the correct Java version
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Source JAR task
java {
    withSourcesJar()
}

// Development JAR task
task devJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'dev'
    
    manifest {
        attributes([
            'FMLAT': 'oc_at.cfg',
            'Specification-Title': project.mod_id,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}

// Configure all JAR tasks
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    // Include license and mod metadata
    from 'LICENSE'
    from 'README.md'
    
    // Ensure consistent timestamps for reproducible builds
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Configure publishing
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archivesBaseName
            
            from components.java
            
            artifact devJar
            
            pom {
                name = project.name
                description = 'OpenComputers mod for Minecraft'
                url = 'https://github.com/MightyPirates/OpenComputers'
                
                scm {
                    url = 'https://github.com/MightyPirates/OpenComputers'
                    connection = 'scm:git:git://github.com/MightyPirates/OpenComputers.git'
                    developerConnection = 'scm:git:git@github.com:MightyPirates/OpenComputers.git'
                }
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/MightyPirates/OpenComputers/blob/master/LICENSE.md'
                    }
                }
                
                developers {
                    developer {
                        id = 'sangar'  // Sangar, the original author
                        name = 'Sangar'
                    }
                }
            }
        }
    }
    
    repositories {
        maven {
            // Configure your Maven repository here for publishing
            // Example:
            // url = uri('file://' + project(':').buildDir.toString() + '/maven')
        }
    }
}

// Print build information
afterEvaluate {
    println('\n=== Build Configuration ===')
    println("Project: ${project.name} ${project.version}")
    println("Java: ${JavaVersion.current()}")
    println("JVM: ${System.getProperty('java.version')} (${System.getProperty('java.vendor')} ${System.getProperty('java.vm.version')})")
    println("Gradle: ${project.gradle.gradleVersion}")
    println("Forge: ${project.forge.gradleVersion}")
    println('======================\n')
}
